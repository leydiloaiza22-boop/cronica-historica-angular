# =========================================================
# NGINX - Crónica Histórica (contenedor "frontend")
# - Sirve la aplicación Angular compilada.
# - Reenvía /api/ al contenedor "backend" por la red interna.
# =========================================================

server {

    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resuelve el nombre de servicio "backend"
    # (Service Discovery). Con la variable, Nginx arranca aunque el
    # backend aún no exista y vuelve a resolver su IP si se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://backend:3000;


    # ---------- API: frontend -> backend ----------
    location /api/ {
        proxy_pass         $api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }


    # ---------- Salud del contenedor (HEALTHCHECK) ----------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }


    # ---------- Archivos estáticos con caché ----------
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }


    # ---------- Rutas de Angular (/historia, /ingresar, ...) ----------
    # Si el archivo no existe se entrega index.html y Angular
    # decide qué página mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }


    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
